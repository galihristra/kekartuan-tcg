<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kekartuan TCG - Play, Collect, Connect</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Set the theme before first paint so light-mode users don't flash dark.
      // Mirrors the fallback logic in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('tk-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- `crossorigin` is what makes this sheet's @font-face rules readable from
         script. Without it the CSSOM refuses cross-origin access, and the
         shareable result image (src/lib/shareImage.ts) can't find the fonts to
         embed, so it renders in whatever the system fallback happens to be.
         Google serves both the CSS and the font files with `Access-Control-
         Allow-Origin: *`, so asking for CORS costs nothing here. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
